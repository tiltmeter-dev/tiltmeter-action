name: Tiltmeter API drift check
description: Detect breaking changes in the third-party APIs your code and AI agents depend on, find code that still uses what providers retired, and apply the changes they announce.
author: Agustin Torres
branding:
  icon: activity
  color: orange

inputs:
  mode:
    description: >-
      "check" checks the endpoints in the config for drift. "scan" searches the code, with
      no config, for known API changes it still uses, such as retired models and removed
      endpoints. "notices" reads the change
      notices and specs the config subscribes to and opens a pull request for each change
      that affects this repository. For API providers, "notice-draft" comments a draft
      notice on pull requests that change the spec's responses, and "notice-publish" signs
      the notices in notices-dir into the feed in site-dir.
    default: check
  config:
    description: Path to tiltmeter.yaml, relative to the workspace.
    default: tiltmeter.yaml
  endpoints:
    description: Only check these endpoint ids, separated by spaces or new lines. Empty checks all of them.
    default: ""
  version:
    description: Tiltmeter version to run from PyPI. Pin it so a new release never changes your CI without a review.
    default: "0.10.0"
  source:
    description: >-
      Install Tiltmeter from here instead of PyPI, such as
      git+https://github.com/tiltmeter-dev/tiltmeter@main, to try a change before it is
      released. Overrides version.
    default: ""
  fail-on:
    description: >-
      When to fail the step. "warning" fails on warning or breaking drift and on checks that
      could not run; "breaking" fails only on breaking drift; "never" only reports.
      A broken configuration always fails, and so does anything that goes wrong in the
      provider modes "notice-draft" and "notice-publish", which have no drift to grade.
    default: warning
  explain:
    description: Ask Claude to explain drift. Needs ANTHROPIC_API_KEY in the step's env.
    default: "true"
  notify:
    description: Send the Slack and webhook notifications declared in the config.
    default: "true"
  cache:
    description: Keep the baseline in the Actions cache between runs. Without it every run records a fresh baseline and never reports drift.
    default: "true"
  cache-key:
    description: Prefix for the cache key. Change it when one repository runs several independent configs.
    default: tiltmeter
  summary:
    description: Write the results to the job summary.
    default: "true"
  agent:
    description: >-
      With mode "notices", or "scan" with fix: the agent that edits the code, deepagents,
      claude-code or codex. Empty uses fix.agent from the config.
    default: ""
  path:
    description: With mode "scan", the folder to search, relative to the workspace.
    default: "."
  within:
    description: >-
      With mode "scan", count a change that has not taken effect yet only when it does
      within this many days. Later ones are listed and do not fail the step. Empty counts
      every change, however far away.
    default: ""
  fix:
    description: >-
      With mode "scan", "true" lets an agent adapt the code to each change that counts and
      opens one pull request per change, once: a change that already has a branch is left
      alone. Needs what mode "notices" needs: an agent, and a token that can push and open
      pull requests.
    default: "false"
  code-scanning:
    description: >-
      With mode "scan", "true" uploads the findings to GitHub code scanning, where each
      use shows up as an alert and on the pull request that adds it. The job needs the
      permission security-events: write.
    default: "false"
  token:
    description: >-
      The token gh uses: to open pull requests with mode "notices" or "scan" with fix,
      and to comment with mode "notice-draft". Pull requests opened with the default GITHUB_TOKEN do not
      trigger other workflows; pass a GitHub App or fine-grained token to have your CI run
      on them.
    default: ${{ github.token }}
  spec:
    description: With mode "notice-draft", the path of your OpenAPI spec in the repository.
    default: ""
  base-url:
    description: >-
      With mode "notice-draft", the URL your paths start from, when the spec's first server
      is relative or templated.
    default: ""
  notices-dir:
    description: Where the provider keeps its notices, one JSON file each.
    default: notices
  site-dir:
    description: >-
      With mode "notice-publish", the folder your site is served from. The feed is written
      to its .well-known/api-changes.json, next to the api-change-key you commit there.
    default: site
  require-notice:
    description: >-
      With mode "notice-draft", fail the step when the pull request changes the spec's
      responses but adds no notice to notices-dir.
    default: "false"

outputs:
  exit-code:
    description: "Tiltmeter's exit code: 0 clean, 1 warning, 2 breaking, 3 a check or a fix failed, 4 configuration error. With mode \"scan\", 1 means the code uses a known API change."
    value: ${{ steps.check.outputs.exit-code }}
  result:
    description: "One word for the run: clean, warning, breaking, failed or error. With mode \"scan\", affected in place of warning."
    value: ${{ steps.check.outputs.result }}
  json:
    description: >-
      Path to the JSON results: one check result per endpoint; with mode "notices", the
      feeds and what was done about each new notice; with "notice-draft", the draft
      notice (empty when nothing changed); with "notice-publish", the feed; with "scan",
      the scan's report.
    value: ${{ steps.check.outputs.json }}
  sarif:
    description: With mode "scan", the path to the findings as SARIF 2.1.0.
    value: ${{ steps.check.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    - name: Pick the Tiltmeter to run
      id: tool
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SOURCE: ${{ inputs.source }}
      run: |
        if [ -n "$SOURCE" ]; then
          echo "package=tiltmeter @ $SOURCE" >> "$GITHUB_OUTPUT"
          echo "fix-package=tiltmeter[fix] @ $SOURCE" >> "$GITHUB_OUTPUT"
        else
          echo "package=tiltmeter==$VERSION" >> "$GITHUB_OUTPUT"
          echo "fix-package=tiltmeter[fix]==$VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Locate the baseline
      id: state
      if: inputs.mode != 'scan'
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        PACKAGE: ${{ steps.tool.outputs.package }}
      run: |
        uvx --quiet --from "$PACKAGE" python "$GITHUB_ACTION_PATH/action.py" state-dir "$CONFIG" >> "$GITHUB_OUTPUT"

    - name: Restore the baseline
      id: restore
      if: inputs.cache == 'true' && !startsWith(inputs.mode, 'notice-') && inputs.mode != 'scan'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.state.outputs.dir }}
        key: ${{ inputs.cache-key }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ inputs.cache-key }}-${{ github.job }}-

    - name: Run Tiltmeter
      id: check
      shell: bash
      env:
        PYTHONUTF8: "1"
        MODE: ${{ inputs.mode }}
        CONFIG: ${{ inputs.config }}
        ENDPOINTS: ${{ inputs.endpoints }}
        PACKAGE: ${{ steps.tool.outputs.package }}
        FIX_PACKAGE: ${{ steps.tool.outputs.fix-package }}
        EXPLAIN: ${{ inputs.explain }}
        NOTIFY: ${{ inputs.notify }}
        SUMMARY: ${{ inputs.summary }}
        CACHE: ${{ inputs.cache }}
        RESTORED: ${{ steps.restore.outputs.cache-matched-key }}
        AGENT: ${{ inputs.agent }}
        GH_TOKEN: ${{ inputs.token }}
        SPEC: ${{ inputs.spec }}
        NOTICES_DIR: ${{ inputs.notices-dir }}
        SITE_DIR: ${{ inputs.site-dir }}
        REQUIRE_NOTICE: ${{ inputs.require-notice }}
        BASE_URL: ${{ inputs.base-url }}
        SCAN_PATH: ${{ inputs.path }}
        WITHIN: ${{ inputs.within }}
        FIX: ${{ inputs.fix }}
      run: |
        json="$RUNNER_TEMP/tiltmeter-results.json"
        sarif=""
        package="$PACKAGE"
        summary_command=summary
        tool() { uvx --quiet --from "$package" "$@"; }
        helper() { tool python "$GITHUB_ACTION_PATH/action.py" "$@"; }
        # The agents: the built-in one needs the fix extra; Claude Code and Codex do not.
        fix_package() {
          case "$AGENT" in
            claude-code|codex) ;;
            *) package="$FIX_PACKAGE" ;;
          esac
        }
        # Commits need an identity; use the Actions bot unless the job set one.
        identity() {
          if ! git config user.email >/dev/null; then
            export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
            export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          fi
        }
        case "$MODE" in
          check)
            args=(check --json --config "$CONFIG")
            for id in $ENDPOINTS; do args+=(--endpoint "$id"); done
            [ "$EXPLAIN" = "true" ] || args+=(--no-llm)
            [ "$NOTIFY" = "true" ] || args+=(--no-notify)
            ;;
          scan)
            json="$RUNNER_TEMP/tiltmeter-scan.json"
            sarif="$RUNNER_TEMP/tiltmeter.sarif"
            rm -f "$sarif"
            case "$WITHIN" in
              ""|*[!0-9]*)
                [ -z "$WITHIN" ] || { echo "::error::within must be a number of days, got '$WITHIN'"; exit 4; }
                ;;
            esac
            args=(scan "$SCAN_PATH" --json --sarif "$sarif")
            [ -n "$WITHIN" ] && args+=(--within "$WITHIN")
            summary_command=""
            ;;
          notices)
            args=(notices apply --yes --json --config "$CONFIG" --repo .)
            [ -n "$AGENT" ] && args+=(--agent "$AGENT")
            fix_package
            identity
            summary_command=notices-summary
            ;;
          notice-draft)
            [ -n "$SPEC" ] || { echo "::error::mode notice-draft needs the spec input"; exit 4; }
            [ -n "${GITHUB_BASE_REF:-}" ] || { echo "::error::mode notice-draft runs on pull_request events"; exit 4; }
            git fetch --quiet --no-tags --depth=1 origin "$GITHUB_BASE_REF" || true
            old="$RUNNER_TEMP/tiltmeter-base-spec"
            json="$RUNNER_TEMP/tiltmeter-draft.json"
            rm -f "$json"
            code=0
            if git show "origin/$GITHUB_BASE_REF:$SPEC" > "$old" 2>/dev/null; then
              create=(notice create --from-openapi "$old" "$SPEC" --if-changed --force -o "$json")
              [ -n "$BASE_URL" ] && create+=(--base-url "$BASE_URL")
              tool tiltmeter "${create[@]}" || code=$?
            else
              echo "$SPEC is new in this pull request: nothing to compare yet."
            fi
            if [ "$code" = "0" ]; then
              comment="$RUNNER_TEMP/tiltmeter-comment.md"
              helper draft-comment "$json" "$SPEC" "$NOTICES_DIR" "$comment"
              helper upsert-comment "$comment" || echo "::warning::could not comment on the pull request"
              if [ -s "$json" ] && [ "$REQUIRE_NOTICE" = "true" ]; then
                if [ -z "$(git diff --name-only "origin/$GITHUB_BASE_REF" HEAD -- "$NOTICES_DIR")" ]; then
                  echo "::error::This pull request changes API responses; add a notice to $NOTICES_DIR (see the comment)."
                  code=1
                fi
              fi
            fi
            [ -s "$json" ] || json=""
            summary_command=""
            ;;
          notice-publish)
            json="$SITE_DIR/.well-known/api-changes.json"
            shopt -s nullglob
            notices=("$NOTICES_DIR"/*.json)
            shopt -u nullglob
            code=0
            if [ "${#notices[@]}" = "0" ]; then
              echo "No notices in $NOTICES_DIR."
            else
              # The key, when set, comes from the TILTMETER_SIGNING_KEY secret in env: never an argument.
              tool tiltmeter notice publish "${notices[@]}" --feed "$json" --replace || code=$?
            fi
            summary_command=""
            ;;
          *)
            echo "::error::mode must be check, scan, notices, notice-draft or notice-publish, got '$MODE'"
            exit 4
            ;;
        esac

        if [ "$MODE" = "check" ] || [ "$MODE" = "notices" ] || [ "$MODE" = "scan" ]; then
          code=0
          tool tiltmeter "${args[@]}" > "$json" || code=$?
        fi

        if [ "$MODE" = "scan" ]; then
          [ -s "$sarif" ] || sarif=""
          fixes=""
          if [ "$FIX" = "true" ] && [ "$code" = "1" ]; then
            fixes="$RUNNER_TEMP/tiltmeter-fixes.json"
            rm -f "$fixes"
            fix_package
            identity
            fixed=0
            helper scan-fix "$json" "$AGENT" "$fixes" || fixed=$?
            # A fix that failed is worse than a change in use; questions for a human are not.
            if [ "$fixed" != "0" ] && [ "$fixed" != "1" ]; then code=3; fi
            package="$PACKAGE"
          fi
          summary_file=""
          [ "$SUMMARY" = "true" ] && summary_file="$GITHUB_STEP_SUMMARY"
          helper scan-summary "$json" "$code" "$summary_file" "$fixes" "$SCAN_PATH"
        fi

        case "$code" in
          0) result=clean ;;
          1) result=warning ;;
          2) result=breaking ;;
          3) result=failed ;;
          *) result=error ;;
        esac
        if [ "$MODE" = "scan" ] && [ "$code" = "1" ]; then result=affected; fi
        {
          echo "exit-code=$code"
          echo "result=$result"
          echo "json=$json"
          echo "sarif=$sarif"
        } >> "$GITHUB_OUTPUT"

        summary_file=""
        [ "$SUMMARY" = "true" ] && summary_file="$GITHUB_STEP_SUMMARY"
        # A cache that held nothing means a run that starts over: say so, it finds nothing.
        state=""
        if [ "$CACHE" = "true" ] && [ -z "$RESTORED" ]; then state=new; fi
        if [ -n "$summary_command" ]; then
          helper "$summary_command" "$json" "$code" "$summary_file" "$state"
        fi

    - name: Save the baseline
      if: always() && inputs.cache == 'true' && !startsWith(inputs.mode, 'notice-') && inputs.mode != 'scan' && steps.check.outputs.exit-code != '4'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.state.outputs.dir }}
        key: ${{ inputs.cache-key }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Upload the findings to code scanning
      if: always() && inputs.mode == 'scan' && inputs.code-scanning == 'true' && steps.check.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ steps.check.outputs.sarif }}
        category: tiltmeter

    - name: Apply fail-on
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
        MODE: ${{ inputs.mode }}
      run: |
        case "$FAIL_ON" in
          warning)  fail="1 2 3 4" ;;
          breaking) fail="2 4" ;;
          never)    fail="4" ;;
          *) echo "::error::fail-on must be warning, breaking or never, got '$FAIL_ON'"; exit 4 ;;
        esac
        # The provider modes grade no drift: a missing notice or a failed publish always fails.
        case "$MODE" in
          notice-*) fail="1 2 3 4" ;;
        esac
        for c in $fail; do
          if [ "$CODE" = "$c" ]; then exit "$CODE"; fi
        done
